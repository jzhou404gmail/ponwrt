# Installed by scripts/systemd/install-oomd-override.sh.
#
# Ubuntu ships /usr/lib/systemd/system/user@.service.d/10-oomd-user-service-defaults.conf
# with:
#     ManagedOOMMemoryPressure=kill
#     ManagedOOMMemoryPressureLimit=50%
#
# A long OpenWrt build running inside a GNOME Terminal scope can push the
# user@1000.service cgroup over 50% memory pressure for 20 s.  systemd-oomd
# then SIGKILLs the whole terminal scope (the build included) -- this is the
# "compile exits by itself" observed on 2026-10-31 14:20:43.
#
# Keep the monitoring but raise the threshold to 100%, so the 50% default
# can no longer kill the terminal.  (The same "kill + 100%" pair can be set
# on a single terminal scope without root; see protect-terminal-scope.sh.)
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=100%
